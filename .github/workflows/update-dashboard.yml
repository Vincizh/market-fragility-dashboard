name: Generate Dashboard

on:
  schedule:
    # GitHub drops many scheduled runs under load (late October 2026: about 6 of 24 hourly
    # runs fired per day), so three off-peak cron lines give each hour three chances.
    # refresh_guard.py skips a scheduled run if the page was generated less than 25 minutes ago.
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Retry attempt (0 = normal run). Set by the workflow itself.'
        required: false
        default: '0'
      retry_for:
        description: 'Sources to retry, separated by |. Set by the workflow itself.'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/health.json
            refresh_guard.py
          sparse-checkout-cone-mode: false

      - name: Wait before a retry attempt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attempt != '0' && inputs.attempt != '' }}
        env:
          ATTEMPT: ${{ inputs.attempt }}
          RETRY_FOR: ${{ inputs.retry_for }}
        run: |
          secs=$(python3 refresh_guard.py delay --attempt "$ATTEMPT" | sed -n 's/^seconds=//p')
          echo "Retry attempt $ATTEMPT for: $RETRY_FOR; waiting ${secs}s"
          sleep "$secs"

      - name: Skip if the page was generated recently
        id: guard
        run: python3 refresh_guard.py skip --health data/health.json --event "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: dashboard-build
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      targets: ${{ steps.decide.outputs.targets }}
      next_attempt: ${{ steps.decide.outputs.next_attempt }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Keep the health record from before this run
        run: cp data/health.json /tmp/health_before.json || echo '{}' > /tmp/health_before.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance requests pandas numpy openpyxl

      - name: Unit tests
        run: |
          python -m unittest test_fast_metrics test_fred_monitor test_dash_state test_stress_calendar test_index_gex test_fragility_chain test_refresh_guard

      # Degraded-source scenario: every live FRED request is forced to fail so the page is built
      # from the archived official CSVs. The artifact is only used for the test and is not committed.
      - name: Generate FRED-cache scenario
        run: MFD_FORCE_FRED_CACHE=1 MFD_OUTPUT=index-degraded.html python generate_dashboard.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      # Browser-level gate on the deployment-style static artifact: the three
      # Dollar Funding Pressure cards must show real values, all three aligned
      # chart panels must render with finite series, the range controls must
      # drive every panel, and mobile must not overflow before anything is
      # pushed to Pages.  The degraded run then blanks one leg's series and
      # asserts the other two panels survive.
      - name: Browser regression check
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node test_dashboard_browser.mjs index.html
          node test_dashboard_degraded.mjs index.html
          node test_dashboard_fred_cache.mjs index-degraded.html

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/spy-concentration-history.json data/fred-cache data/health.json data/chain-state.json
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push

      - name: Decide whether to retry
        id: decide
        if: ${{ always() }}
        env:
          ATTEMPT: ${{ inputs.attempt || '0' }}
          RETRY_FOR: ${{ inputs.retry_for }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 refresh_guard.py retry --before /tmp/health_before.json --after data/health.json \
            --attempt "$ATTEMPT" --retry-for "$RETRY_FOR" --job-status "$JOB_STATUS" | tee -a "$GITHUB_OUTPUT"

  retry:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.outputs.next_attempt != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the next attempt
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.build.outputs.next_attempt }}
          TARGETS: ${{ needs.build.outputs.targets }}
        run: |
          echo "Retrying (attempt $NEXT) for: $TARGETS"
          gh workflow run update-dashboard.yml --repo "$GITHUB_REPOSITORY" --ref main -f attempt="$NEXT" -f retry_for="$TARGETS"
